server:
  port: ${PORT:8082}

spring:
  application:
    name: matchmaking-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Where to reach the other two services this one talks to. Local dev:
# defaults just work if auth-service and game-engine-service are running
# per their own Sessions. On Render/Railway, override both with the
# deployed URLs as env vars.
services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  game-engine-service:
    url: ${GAME_ENGINE_SERVICE_URL:http://localhost:8083}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://<PROJECT-REF>.supabase.co:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

---
# Activate with SPRING_PROFILES_ACTIVE=render. Same pooler-port reasoning
# as auth-service and game-engine-service — see their application.yml notes.
spring:
  config:
    activate:
      on-profile: render
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://<PROJECT-REF>.pooler.supabase.com:6543/postgres?prepareThreshold=0}
    username: ${SUPABASE_DB_USER:postgres.<PROJECT-REF>}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
