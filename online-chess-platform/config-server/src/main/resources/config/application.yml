# Shared defaults for every service that pulls config from this server.
# Per-service overrides go in a file named after spring.application.name,
# e.g. auth-service.yml, game-engine-service.yml — you'll add those in the
# sessions where those services get built. This file only holds what's truly
# common across all of them, so it stays small.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
