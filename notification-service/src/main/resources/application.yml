server:
  port: ${PORT:8085}

spring:
  application:
    name: notification-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # See auth-service's application.yml comment for why this is needed -
    # every service shares one physical database, so each needs its own
    # Flyway history table to avoid a checksum collision with the others'
    # unrelated "version 1" migrations.
    table: flyway_history_notification

  # Plain PostgreSQL - same DB_* env vars as every other service, see
  # auth-service's application.yml for the full explanation.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chess_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  # RabbitMQ connection. This service and game-engine-service (the
  # publisher) MUST point at the exact same broker/vhost/credentials, or
  # neither side's declared exchange/queues will ever see each other's
  # traffic. See the README's Session 7 section for the recommended
  # CloudAMQP free-tier setup (no Docker, no local install needed -
  # decompose its dashboard connection info into the individual fields
  # below rather than using its single amqp:// URL string, since Spring
  # Boot's spring.rabbitmq.addresses doesn't reliably parse embedded
  # credentials from a full URI).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        # Don't retry forever on a message that keeps failing to parse -
        # log it (see GameEventListener) and move on rather than blocking
        # the queue. A production system would route failures to a
        # dead-letter queue instead; out of scope for this project.
        default-requeue-rejected: false

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
