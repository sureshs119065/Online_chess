server:
  port: ${PORT:8083}

spring:
  application:
    name: game-engine-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_history_game_engine
    baseline-on-migrate: true
    baseline-version: "0"

  # Plain PostgreSQL - same DB_* env vars as every other service, see
  # auth-service's application.yml for the full explanation. Local dev:
  # your own locally installed Postgres. Deployed: Render's free Postgres,
  # using its *Internal* connection info since this service also runs on
  # Render.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chess_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  # Must point at the same broker/vhost/credentials as notification-service's
  # spring.rabbitmq.* block (Session 7) - see that service's application.yml
  # for the full explanation and the recommended CloudAMQP free-tier setup.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

# Where to reach auth-service for ELO reads/writes (EloUpdateClient).
# Local dev: the default below (localhost:8081) just works if auth-service
# is running per Session 3. On Render, set this to that service's public
# URL as an env var.
services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

# Must match the same value configured on auth-service's internal endpoint
# (InternalUserController) - see that service's application.yml addition.
internal:
  service-key: ${INTERNAL_SERVICE_KEY:change-me-internal-key}

# Must match auth-service's jwt.secret exactly, same as api-gateway's copy of
# this value - used to verify the token passed as a WS query param during
# the /ws/game handshake (JwtHandshakeInterceptor), since a browser can't set
# an Authorization header on a WebSocket upgrade request.
jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
